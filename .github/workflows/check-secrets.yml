name: Check secrets

# 朝会サーバー用の secrets が登録されていて有効かだけを確認する（値やメールアドレスは表示しない）
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-wedzei]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OR_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MT: ${{ secrets.MEETING_TOKEN }}
    steps:
      - name: 登録の有無
        run: |
          ok=1
          for n in CF_TOKEN CF_ACCOUNT OR_KEY MT; do
            if [ -z "${!n}" ]; then echo "NG: $n が空"; ok=0; else echo "OK: $n あり（${#n}）"; fi
          done
          echo "MEETING_TOKEN の長さ: ${#MT}"
          echo "ACCOUNT_ID の長さ: ${#CF_ACCOUNT}"
          [ $ok = 1 ]
      - name: Cloudflare トークンが有効か
        if: always()
        run: |
          s=$(curl -s https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result.status // "invalid"')
          echo "token status: $s"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts" -H "Authorization: Bearer $CF_TOKEN")
          echo "workers scripts API (account): HTTP $code"
          [ "$s" = active ] && [ "$code" = 200 ]
      - name: OpenRouter キーが有効か
        if: always()
        run: |
          r=$(curl -s https://openrouter.ai/api/v1/key -H "Authorization: Bearer $OR_KEY")
          echo "$r" | jq '{limit: .data.limit, limit_reset: .data.limit_reset, usage: .data.usage}'
          echo "$r" | jq -e '.data' >/dev/null
