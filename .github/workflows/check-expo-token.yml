name: Check EXPO_TOKEN

# EXPO_TOKEN が登録されていて、Expo にログインできるかだけを確認する（トークンは表示しない）
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-wedzei]

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: EXPO_TOKEN があるか
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "EXPO_TOKEN が見つかりません"; exit 1; fi
          echo "EXPO_TOKEN は登録されています"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Expo にログインできるか
        run: npx -y eas-cli@latest whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
