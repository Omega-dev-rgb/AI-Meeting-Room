# main が更新されるたびに EAS Update へ配信し、iPhone の Expo Go で最新版を開けるようにする
name: EAS Update

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until EAS is configured
        id: gate
        run: |
          if grep -q '"projectId"' app.json; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "app.json に projectId がないため配信をスキップ"; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - name: Publish update
        if: steps.gate.outputs.ready == 'true'
        run: |
          npx --yes eas-cli@27.4.1 update --channel main --message "$(git log -1 --pretty=%s)" --platform all --non-interactive --json > update.json
          node -e '
            const u = JSON.parse(require("fs").readFileSync("update.json", "utf8"));
            const ios = u.find((x) => x.platform === "ios");
            const pid = require("./app.json").expo.extra.eas.projectId;
            const lines = [
              "### iPhone（Expo Go）で開く",
              "",
              "- 常に最新版: `exp://u.expo.dev/" + pid + "?channel-name=main&runtime-version=" + ios.runtimeVersion + "`",
              "- この更新だけ: `exp://u.expo.dev/update/" + ios.id + "`",
              "",
              "iPhone の Safari のアドレス欄に貼り付けて開くと Expo Go が起動します。",
            ];
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          '
